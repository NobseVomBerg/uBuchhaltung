# Führt Anonymisierungs-Guard und pytest aus – bei jedem Push (alle Branches)
# und bei jedem Pull Request. PRs aus Branches dieses Repos laufen damit
# doppelt. Das ist gewollt: Ein per `if` übersprungener Job meldet GitHub als
# bestanden und würde den Pflicht-Check `pytest` im Ruleset von main aushebeln.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Python einrichten (wie im Dockerfile)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Anonymisierungs-Guard (Testdaten)
        run: python tests/check_anonymized.py

      # Jeder Test legt eine eigene SQLite-Datenbank an, und jedes Speichern wartet auf die Platte – das macht den
      # größten Teil der Laufzeit aus. Die Arbeitsdaten der Tests (data/tests/, siehe tests/conftest.py) liegen deshalb
      # im Arbeitsspeicher des Runners; bestandene Tests räumen ihre Daten sofort wieder ab.
      - name: Arbeitsdaten der Tests in den Arbeitsspeicher legen
        run: |
          mkdir -p /dev/shm/ubuchhaltung-tests data
          ln -s /dev/shm/ubuchhaltung-tests data/tests

      - name: pytest
        run: python -m pytest -q -rs -n 4

  # E-Rechnung: ZUGFeRD-PDFs (PDF/A-3 + CII) und UBL-XRechnung aus den Demodaten
  # erzeugen und mit Mustang prüfen (XSD + Schematron; PDF per veraPDF). Die
  # erzeugten Dateien hängen als Artefakt am Lauf (Sichtprüfung).
  einvoice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MUSTANG_VERSION: '2.26.0'
      # SHA-256 der Mustang-CLI-JAR von Maven Central (feste Version, geprüft)
      MUSTANG_SHA256: '42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736'
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Python einrichten (wie im Dockerfile)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Java einrichten (für Mustang)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Beispiel-E-Rechnungen erzeugen
        run: python tools/make_einvoice_samples.py einvoice-samples

      # Maven Central lieferte einmal HTTP 429: Die JAR liegt deshalb im Zwischenspeicher, geladen wird nur bei einem Fehltreffer. Der Schlüssel trägt Version und Prüfsumme (eine
      # neue Version oder Prüfsumme ergibt einen neuen Eintrag). Die Prüfsumme wird IMMER geprüft, auch nach einem Treffer: Der Zwischenspeicher ersetzt sie nie.
      - name: Mustang-CLI aus dem Zwischenspeicher holen
        id: mustang-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: mustang.jar
          key: mustang-${{ env.MUSTANG_VERSION }}-${{ env.MUSTANG_SHA256 }}

      - name: Mustang-CLI laden (feste Version)
        if: steps.mustang-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 15 -o mustang.jar \
            "https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/${MUSTANG_VERSION}/Mustang-CLI-${MUSTANG_VERSION}.jar"

      - name: Mustang-CLI prüfen (Prüfsumme)
        run: echo "${MUSTANG_SHA256}  mustang.jar" | sha256sum -c -

      - name: Mit Mustang validieren
        run: |
          status=0
          for f in einvoice-samples/*.pdf einvoice-samples/*.xml; do
            echo "::group::Mustang validate $f"
            java -jar mustang.jar --action validate --source "$f" > "$f.report.xml" 2> "$f.stderr.txt" || true
            cat "$f.report.xml"; cat "$f.stderr.txt"
            echo "::endgroup::"
            if grep -q 'status="invalid"' "$f.report.xml" || ! grep -q 'status="valid"' "$f.report.xml"; then
              echo "::error file=$f::Mustang meldet die Datei als ungültig (Bericht: $f.report.xml)"
              status=1
            fi
          done
          exit $status

      - name: Beispiele und Prüfberichte als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: einvoice-samples
          path: einvoice-samples/
          if-no-files-found: warn
