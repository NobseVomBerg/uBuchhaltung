# Führt Anonymisierungs-Guard und pytest aus – bei jedem Push (alle Branches)
# und bei jedem Pull Request. PRs aus Branches dieses Repos laufen damit
# doppelt. Das ist gewollt: Ein per `if` übersprungener Job meldet GitHub als
# bestanden und würde den Pflicht-Check `pytest` im Ruleset von main aushebeln.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten (wie im Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Anonymisierungs-Guard (Testdaten)
        run: python tests/check_anonymized.py

      - name: pytest
        run: python -m pytest -q -rs
