# Baut das Docker-Image, veröffentlicht es in der GitHub Container Registry
# (ghcr.io) und legt Releases automatisch an.
#
#   Push auf main, version.py mit neuer Version   → :1.6.17, :1.6, :1, :latest, :edge
#     (noch kein Tag v1.6.17)                        danach Tag + GitHub-Release
#                                                    mit automatischen Release-Notizen
#   Push auf main ohne neue Version (z. B. Doku)  → nur :edge
#   Release von Hand veröffentlicht               → :X.Y.Z, :X.Y, :X, :latest
#
# Ein Versionssprung in version.py ist damit der Release – ohne Klick. Vor dem
# Bauen laufen Anonymisierungs-Guard und pytest; der Release entsteht erst,
# wenn das Image gebaut ist. Releases, die ein Workflow mit dem GITHUB_TOKEN
# anlegt, lösen keine weiteren Workflows aus – deshalb baut dieser Lauf selbst.
# Neu bauen (z. B. für Sicherheitsupdates des Basis-Images): den Lauf unter
# Actions erneut ausführen.
#
# Einmalig nach dem ersten Lauf: GitHub -> Profil -> Packages -> ubuchhaltung
# -> Package settings -> "Change visibility" auf Public stellen, damit
# Unraid/Proxmox das Image ohne Anmeldung ziehen können.
name: Docker-Image veröffentlichen (GHCR)

on:
  release:
    types: [published]
  push:
    branches: [main]

# Nicht abbrechen: ein laufender Release-Lauf soll sein Image und seinen Tag
# vollständig anlegen. Weitere Läufe warten.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gleiche Schritte wie tests.yml – bewusst kopiert statt per workflow_call
  # eingebunden, damit sich die beiden Läufe nicht gegenseitig abbrechen.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten (wie im Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Release-Tag passt zu version.py? (nur bei Release von Hand)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          APP="$(python -c 'import version; print(version.APP_VERSION)')"
          if [ "$TAG" != "v$APP" ]; then
            echo "::error::Release-Tag '$TAG' passt nicht zu version.py (erwartet v$APP)"
            exit 1
          fi

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Anonymisierungs-Guard (Testdaten)
        run: python tests/check_anonymized.py

      - name: pytest
        run: python -m pytest -q -rs

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Version und Release-Bedarf ermitteln
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          APP="$(python3 -c 'import version; print(version.APP_VERSION)')"
          if [ "$EVENT" = "release" ]; then
            TAG="$REL_TAG"; NEW=false; RELEASE=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v$APP" >/dev/null; then
            TAG="v$APP"; NEW=false; RELEASE=false
          else
            TAG="v$APP"; NEW=true; RELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $APP – Tag $TAG – Release-Images: $RELEASE – neuer Release: $NEW"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nobsevomberg/ubuchhaltung
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    if: needs.build-and-push.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag und GitHub-Release anlegen (Notizen automatisch aus den PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
