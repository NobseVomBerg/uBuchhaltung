# Lässt die pytest-Suite mit den Python-Versionen laufen, die neuer sind als die
# des Docker-Images (dort und in tests.yml: 3.13). Je Version läuft die ganze
# Suite noch einmal – deshalb nicht bei jedem Push, sondern einmal in der Woche und
# von Hand (Actions → „Tests (weitere Python-Versionen)“ → „Run workflow“,
# z. B. vor einer größeren Veröffentlichung).
#
# Kommt eine neue Python-Version heraus, hier in der Liste ergänzen. Schlägt
# eine Version fehl, laufen die anderen weiter (fail-fast: false).
name: Tests (weitere Python-Versionen)

on:
  schedule:
    # sonntags 03:17 UTC
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-python-versions
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - name: Code auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      # Jeder Test legt eine eigene SQLite-Datenbank an, und jedes Speichern wartet auf die Platte – das macht den
      # größten Teil der Laufzeit aus. Die Arbeitsdaten der Tests (data/tests/, siehe tests/conftest.py) liegen deshalb
      # im Arbeitsspeicher des Runners; bestandene Tests räumen ihre Daten sofort wieder ab.
      - name: Arbeitsdaten der Tests in den Arbeitsspeicher legen
        run: |
          mkdir -p /dev/shm/ubuchhaltung-tests data
          ln -s /dev/shm/ubuchhaltung-tests data/tests

      - name: pytest
        run: python -m pytest -q -rs -n 4
