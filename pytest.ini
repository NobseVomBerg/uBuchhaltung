[pytest]
testpaths = tests
# pytest-Cache neben die Testläufe (tests/conftest.py: data/tests/tmp/) statt als
# .pytest_cache/ in den Projektordner; relativ zum rootdir, data/ ist ignoriert.
cache_dir = data/tests/cache
# Testdatenbanken und SQL-Protokolle summieren sich je Lauf auf einige hundert MB. Nach dem
# Lauf bleiben deshalb nur die tmp_path-Verzeichnisse fehlgeschlagener Tests liegen (zur
# Fehlersuche), und zwar aus den letzten zwei Läufen. Ein grüner Lauf hinterlässt nichts.
tmp_path_retention_policy = failed
tmp_path_retention_count = 2
